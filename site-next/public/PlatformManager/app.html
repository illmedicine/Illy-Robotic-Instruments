<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Manager</title>
  <link rel="icon" type="image/svg+xml" href="/PlatformManager/assets/img/favicon.svg">
  <link rel="manifest" href="/PlatformManager/assets/manifest.webmanifest">
  <script src="/PlatformManager/assets/js/favicon.js"></script>
  <link rel="stylesheet" href="/PlatformManager/assets/css/app.css">
  <script src="/PlatformManager/assets/js/theme-init.js"></script>
  <script>window.PPM_STATIC="/PlatformManager/assets/data/snapshot.json";</script>
  <script src="/PlatformManager/assets/js/boot-check.js"></script>
</head>
<body>
  <div style="background:#fff4ce;color:#4a3b00;padding:6px 12px;font:13px Segoe UI,sans-serif;text-align:center">Read-only online demo with synthetic data. Nothing here is real, and actions that change anything are switched off. <a href="/PlatformManager/" style="color:inherit;font-weight:600">Watch the showcase</a></div>
  <header class="titlebar">
    <button class="btn menubtn" id="menubtn" type="button" aria-controls="nav" aria-expanded="false" aria-label="Show navigation" title="Show navigation"></button>
    <a class="brand" id="brand" href="/PlatformManager/my-overview" title="Back to My overview, with the menus collapsed"><img src="/PlatformManager/assets/img/favicon.svg" alt=""><span>Platform Manager</span></a>
    <div class="spacer"></div>
    <div class="livechip" id="livechip" role="status"><span class="dot"></span><span id="livetext">Connecting...</span></div>
    <button class="btn" id="syncbtn" type="button" title="Refresh all data sources now"></button>
    <div class="userchip" id="userchip" hidden></div>
    <button class="btn" id="soundbtn" type="button" aria-label="Button sounds" aria-pressed="true"></button>
    <button class="btn" id="themebtn" type="button" aria-label="Toggle theme"></button>
  </header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="main" id="main"><div class="loading">Loading...</div></main>
  <script type="module" src="/PlatformManager/assets/js/main.js"></script>
</body>
</html>
