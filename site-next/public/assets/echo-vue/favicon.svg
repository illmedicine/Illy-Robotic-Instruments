<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- Each signal is centred on the tile's inner corner (the corner nearest the grid centre), so it faces outward. -->
    <g id="signal" fill="none" stroke-linecap="round">
      <!-- Top-left tile: strongest -->
      <path d="M15.5 19.5 A4 4 0 0 1 19.5 15.5"/>
      <path d="M11.5 19.5 A8 8 0 0 1 19.5 11.5"/>
      <path d="M7.5 19.5 A12 12 0 0 1 19.5 7.5"/>
      <!-- Top-right tile: strong -->
      <path d="M28.5 15.5 A4 4 0 0 1 32.5 19.5"/>
      <path d="M28.5 11.5 A8 8 0 0 1 36.5 19.5"/>
      <path d="M28.5 7.5 A12 12 0 0 1 40.5 19.5" opacity="0.25"/>
      <!-- Bottom-left tile: weak -->
      <path d="M15.5 28.5 A4 4 0 0 0 19.5 32.5"/>
      <path d="M11.5 28.5 A8 8 0 0 0 19.5 36.5" opacity="0.25"/>
      <path d="M7.5 28.5 A12 12 0 0 0 19.5 40.5" opacity="0.25"/>
      <!-- Bottom-right tile: no usable signal -->
      <path d="M32.5 28.5 A4 4 0 0 1 28.5 32.5" opacity="0.15"/>
      <path d="M36.5 28.5 A8 8 0 0 1 28.5 36.5" opacity="0.15"/>
      <path d="M40.5 28.5 A12 12 0 0 1 28.5 40.5" opacity="0.15"/>
    </g>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="16s" repeatCount="indefinite"/>
    <!-- Panes use the Windows logo colours: red, green, blue, yellow -->
    <rect x="4" y="4" width="18" height="18" rx="2" fill="#F25022"/>
    <rect x="26" y="4" width="18" height="18" rx="2" fill="#7FBA00"/>
    <rect x="4" y="26" width="18" height="18" rx="2" fill="#00A4EF"/>
    <rect x="26" y="26" width="18" height="18" rx="2" fill="#FFB900"/>
    <!-- Dark halo keeps the orange readable on the yellow and green tiles -->
    <use href="#signal" stroke="#0b1d33" stroke-opacity="0.35" stroke-width="4.4"/>
    <use href="#signal" stroke="#ff8a1f" stroke-width="2.4"/>
    <!-- Sensor dots in each tile's inner corner -->
    <g fill="#ff8a1f">
      <circle cx="19.5" cy="19.5" r="1.9"/>
      <circle cx="28.5" cy="19.5" r="1.9"/>
      <circle cx="19.5" cy="28.5" r="1.9"/>
      <circle cx="28.5" cy="28.5" r="1.9" opacity="0.5"/>
    </g>
  </g>
</svg>
